name: iOS App Store upload

on:
  workflow_dispatch:
    inputs:
      upload_to_app_store:
        description: Validate and upload IPA to App Store Connect
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  ios-app-store-upload:
    name: Build signed IPA for App Store Connect
    runs-on: macos-latest

    env:
      APP_BUNDLE_ID: cloud.yuyay.hensai
      IOS_SCHEME: App
      IOS_PROJECT: ios/App/App.xcodeproj
      ARCHIVE_PATH: build/Hensai.xcarchive
      EXPORT_PATH: build/export

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Select Xcode 26 or later
        run: |
          CURRENT_XCODE_VERSION="$(xcodebuild -version | awk '/^Xcode / { print $2 }')"
          case "$CURRENT_XCODE_VERSION" in
            2[6-9]*|[3-9][0-9]*)
              xcodebuild -version
              exit 0
              ;;
          esac

          XCODE_APP="$(find /Applications -maxdepth 1 -name 'Xcode_2[6-9]*.app' -print | sort | tail -n 1)"
          test -n "$XCODE_APP" || {
            echo "::error::Xcode 26 or later is required for App Store Connect uploads."
            find /Applications -maxdepth 1 -name 'Xcode*.app' -print
            exit 1
          }

          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare iOS signing files
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          test -n "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" || { echo "::error::IOS_DISTRIBUTION_CERTIFICATE_BASE64 is missing"; exit 1; }
          test -n "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" || { echo "::error::IOS_DISTRIBUTION_CERTIFICATE_PASSWORD is missing"; exit 1; }
          test -n "$IOS_PROVISIONING_PROFILE_BASE64" || { echo "::error::IOS_PROVISIONING_PROFILE_BASE64 is missing"; exit 1; }
          test -n "$IOS_PROVISIONING_PROFILE_NAME" || { echo "::error::IOS_PROVISIONING_PROFILE_NAME is missing"; exit 1; }

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_SOURCE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST_PATH="$RUNNER_TEMP/profile.plist"

          echo "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_SOURCE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_SOURCE_PATH" > "$PROFILE_PLIST_PATH"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST_PATH")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST_PATH")"
          test "$PROFILE_NAME" = "$IOS_PROVISIONING_PROFILE_NAME" || {
            echo "::error::IOS_PROVISIONING_PROFILE_NAME does not match the provisioning profile name. Expected '$PROFILE_NAME'."
            exit 1
          }

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_INSTALLED_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          cp "$PROFILE_SOURCE_PATH" "$PROFILE_INSTALLED_PATH"

          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "PROFILE_INSTALLED_PATH=$PROFILE_INSTALLED_PATH"
          } >> "$GITHUB_ENV"

      - name: Sync Capacitor iOS project
        run: |
          pnpm run build:web
          pnpm exec cap sync ios

      - name: Archive signed iOS app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          test -n "$APPLE_TEAM_ID" || { echo "::error::APPLE_TEAM_ID is missing"; exit 1; }
          xcodebuild \
            -project "$IOS_PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE_NAME" \
            clean archive

      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$APP_BUNDLE_ID</key>
              <string>$IOS_PROVISIONING_PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hensai-app-store-ipa
          path: build/export/*.ipa
          if-no-files-found: error

      - name: Validate and upload to App Store Connect
        if: ${{ inputs.upload_to_app_store }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          test -n "$APP_STORE_CONNECT_API_KEY_ID" || { echo "::error::APP_STORE_CONNECT_API_KEY_ID is missing"; exit 1; }
          test -n "$APP_STORE_CONNECT_API_ISSUER_ID" || { echo "::error::APP_STORE_CONNECT_API_ISSUER_ID is missing"; exit 1; }
          test -n "$APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64" || { echo "::error::APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 is missing"; exit 1; }

          IPA_PATH="$(ls build/export/*.ipa | head -n 1)"
          mkdir -p private_keys
          echo "$APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64" | base64 --decode > "private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          xcrun altool --validate-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Clean up iOS signing files
        if: ${{ always() }}
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          if [ -n "${PROFILE_INSTALLED_PATH:-}" ]; then
            rm -f "$PROFILE_INSTALLED_PATH"
          fi
          rm -rf private_keys
